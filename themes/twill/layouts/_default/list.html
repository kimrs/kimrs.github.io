{{ define "main" }}
<div class="content-wrap">
  {{ if .IsHome }}
    <div class="post-list">
      {{ range .Site.RegularPages.ByDate.Reverse }}
        {{ partial "post-card.html" . }}
      {{ end }}
    </div>
  {{ else }}
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    <div class="post-list">
      {{ range .Pages.ByDate.Reverse }}
        {{ partial "post-card.html" . }}
      {{ end }}
    </div>
  {{ end }}
</div>
{{ end }}
